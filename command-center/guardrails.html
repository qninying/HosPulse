<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('hospulse-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
  })();
</script>
<title>HosPulse Guardrails</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<link rel="stylesheet" href="assets/command-center.css" />
</head>
<body>
  <header class="cc-header">
    <div class="cc-header-top">
      <div class="cc-brand">
        <img src="assets/icon.svg" width="24" height="24" alt="HosPulse" style="border-radius:6px;display:block;">
        Command Center <span class="cc-brand-sub" id="cc-project-sub"></span>
      </div>
      <div class="cc-header-controls">
        <div class="cc-mode-toggle" id="cc-mode-toggle"></div>
        <button class="cc-theme-toggle" id="cc-theme-toggle" aria-label="Switch between day and night theme" title="Day / Night"></button>
      </div>
    </div>
    <div class="cc-data-as-of" id="cc-data-as-of">Loading…</div>
    <nav class="cc-nav" id="cc-nav"></nav>
  </header>
  <main>
    <h1 class="cc-page-title">Guardrails</h1>
    <p class="cc-page-desc">The promises HosPulse makes, and whether anything in the build enforces each one yet. A guardrail whose stories are not verified is a promise made and not yet kept.</p>
    <div id="cc-content">Loading…</div>
  </main>
  <script src="assets/command-center.js"></script>
  <script>
  (function () {
    const { esc, getParam, statusDot, sampleBadge, verificationForRequirement } = CommandCenter;

    // Sample overlay only. The real computation stays honest.
    const SAMPLE_STATES = { "REQ-003": "partial", "REQ-004": "enforced", "REQ-008": "not_enforced", "REQ-009": "not_enforced", "REQ-014": "not_enforced" };

    function label(state) {
      if (state === "enforced") return "Enforced";
      if (state === "partial") return "Partly enforced";
      if (state === "not_enforced") return "Promised, not yet enforced";
      return "No story fulfils this yet";
    }

    function guardrails(plan) {
      return (plan.derived && plan.derived.guardrails) || [];
    }

    function renderList({ plan, progress, mode }) {
      const el = document.getElementById("cc-content");
      const list = guardrails(plan);
      if (list.length === 0) {
        el.innerHTML = `<div class="cc-empty-state">The plan has no SAFE requirements. That is worth fixing before building further.</div>`;
        return;
      }
      el.innerHTML = `<div class="cc-grid">` + list.map((g) => {
        const req = (plan.requirements || []).find((r) => r.id === g.id);
        const real = verificationForRequirement(plan, progress, req);
        const state = mode === "sample" ? (SAMPLE_STATES[g.id] || real.state) : real.state;
        return `
          <a class="cc-card" href="guardrails.html?id=${encodeURIComponent(g.id)}">
            <h3>${statusDot(state)}${esc(g.id)}${sampleBadge()}</h3>
            <p>${esc(g.statement)}</p>
            <p style="margin-top:8px; font-weight:600;">${label(state)}</p>
          </a>`;
      }).join("") + `</div>`;
    }

    function renderDetail({ plan, progress, mode }, id) {
      const el = document.getElementById("cc-content");
      const g = guardrails(plan).find((x) => x.id === id);
      if (!g) {
        el.innerHTML = `<p class="cc-back"><a href="guardrails.html">&larr; Guardrails</a></p><div class="cc-empty-state">No guardrail "${esc(id)}" in the plan.</div>`;
        return;
      }
      const req = (plan.requirements || []).find((r) => r.id === g.id);
      const v = verificationForRequirement(plan, progress, req);
      const state = mode === "sample" ? (SAMPLE_STATES[g.id] || v.state) : v.state;
      el.innerHTML = `
        <p class="cc-back"><a href="guardrails.html">&larr; Guardrails</a></p>
        <div class="cc-panel-box">
          <p class="cc-kicker">${statusDot(state)}${esc(g.id)} · ${label(state)}${sampleBadge()}</p>
          <p style="margin:0 0 16px; font-size:15px;">${esc(g.statement)}</p>
          ${v.stories.length === 0
            ? `<p style="color:var(--cc-muted);">No story is mapped to this guardrail, so nothing enforces it.</p>`
            : `<div class="cc-table-wrap"><table class="cc-table"><thead><tr><th>Story</th><th>Title</th><th>State (real)</th></tr></thead><tbody>` +
              v.stories.map((s) => `<tr><td><a href="project-management.html?id=${encodeURIComponent(s.id)}">${esc(s.id)}</a></td><td>${esc(s.title)}</td><td>${statusDot(s.state)}${esc(s.state)}</td></tr>`).join("") +
              `</tbody></table></div>`}
        </div>
      `;
    }

    CommandCenter.init("guardrails", (data) => {
      const id = getParam("id");
      if (id) renderDetail(data, id); else renderList(data);
    });
  })();
  </script>
</body>
</html>
